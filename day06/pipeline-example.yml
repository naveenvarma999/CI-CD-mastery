name: FastAPI CI Pipeline

triggers:
  branches:
    - main
    - development

environment:
  PYTHON_VERSION: "3.11"
  APP_ENV: testing

jobs:
  lint:
    runner: ubuntu-latest
    commands:
      - ruff check .
      - black --check .

  test:
    runner: ubuntu-latest
    commands:
      - pip install -r requirements.txt
      - pytest